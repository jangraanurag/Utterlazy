worker_processes auto;
events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # ─── API Gateway (api.utterlazy.com) ───
    server {
        listen 80;
        server_name api.utterlazy.com;

        location / {
            proxy_pass http://api-gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── Catalog API (catalog.utterlazy.com) ───
    server {
        listen 80;
        server_name catalog.utterlazy.com;

        client_max_body_size 50M;

        location / {
            proxy_pass http://catalog-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /storage/ {
            alias /var/www/storage/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── WebSocket (Reverb) ───
    server {
        listen 80;
        server_name ws.utterlazy.com;

        location / {
            proxy_pass http://reverb:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
    }

    # ─── Customer Web (utterlazy.com) ───
    server {
        listen 80;
        server_name utterlazy.com www.utterlazy.com;

        root /var/www/customer;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /sw.js {
            root /var/www/customer;
            add_header Cache-Control "no-cache";
        }
    }

    # ─── Vendor Web (vendor.utterlazy.com) ───
    server {
        listen 80;
        server_name vendor.utterlazy.com;

        root /var/www/vendor;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ─── Admin Web (admin.utterlazy.com) ───
    server {
        listen 80;
        server_name admin.utterlazy.com;

        root /var/www/admin;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
